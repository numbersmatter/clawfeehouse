packages:
  - packages/*
  - apps/*
overrides:
  typescript: 6.0.3
  chokidar: 5.0.0
  "@types/node": ^24.12.4
  tinyexec: 1.2.4
  vitest: 4.1.8
  semver: 7.8.1
injectWorkspacePackages: true
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
#per-project
minimumReleaseAge: 4320 # 3 days
blockExoticSubdeps: true
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  - '@vitest/expect@4.1.8'
  - '@vitest/mocker@4.1.8'
  - '@vitest/pretty-format@4.1.8'
  - '@vitest/runner@4.1.8'
  - '@vitest/snapshot@4.1.8'
  - '@vitest/spy@4.1.8'
  - '@vitest/utils@4.1.8'
  - tinyexec@1.2.4
  - vitest@4.1.8
